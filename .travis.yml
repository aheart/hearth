os:
  - linux
  - osx
dist: trusty
sudo: required
cache: cargo
language: rust
addons:
  apt:
    packages:
      - libssl-dev

rust:
  - nightly

before_install:
  - if [ "$TRAVIS_OS_NAME" == "osx" ]; then brew install openssl; fi

script:
  - cargo build
  - cargo test

after_success: |
  RUSTFLAGS="--cfg procmacro2_semver_exempt" cargo install cargo-tarpaulin
  cargo tarpaulin --ciserver travis-ci --coveralls $TRAVIS_JOB_ID